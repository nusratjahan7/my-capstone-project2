<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="form-card" aria-labelledby="settings-title">
        <div class="form-header">
          <p class="eyebrow">Preferences</p>
          <h1 id="settings-title">User Settings</h1>
          <p class="subtitle">Update your account details.</p>
        </div>

        <form id="settings-form" novalidate>
          <div class="form-grid">
            <div class="field field-full">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" autocomplete="username" aria-describedby="username-error" aria-invalid="false" />
              <small class="error" id="username-error" role="alert"></small>
            </div>

            <div class="field field-full">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" aria-invalid="false" />
              <small class="error" id="email-error" role="alert"></small>
            </div>

            <div class="field field-full">
              <label for="password">New password <span class="optional">(optional)</span></label>
              <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help password-error" aria-invalid="false" />
              <small id="password-help" class="help-text">Use 8 or more characters with uppercase, lowercase, and a special character.</small>
              <small class="error" id="password-error" role="alert"></small>
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="primary-btn">Save settings</button>
            <p id="success-message" class="success-message" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
